<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="draftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="draftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#draftGrad)"/>
  <!-- Grid overlay representing drafting board -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
  </g>
  <!-- Mini Drafter Clamp and Arms -->
  <g filter="url(#draftShadow)">
    <!-- Top Clamp -->
    <rect x="90" y="50" width="70" height="35" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="125" cy="67" r="10" fill="#f59e0b"/>
    <!-- Parallel Arms -->
    <line x1="125" y1="67" x2="240" y2="170" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="145" y1="67" x2="260" y2="170" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Central Pivot Joint -->
    <circle cx="250" cy="170" r="16" fill="#475569" stroke="#f1f5f9" stroke-width="3"/>
    <!-- Lower Arms -->
    <line x1="250" y1="170" x2="380" y2="220" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="265" y1="180" x2="395" y2="230" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Protractor Dial Head -->
    <circle cx="410" cy="240" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="410" cy="240" r="10" fill="#f59e0b"/>
    <!-- Transparent L-Scale Blades -->
    <rect x="410" y="235" width="140" height="26" fill="#ffffff" fill-opacity="0.85" rx="3" stroke="#64748b"/>
    <rect x="398" y="100" width="24" height="140" fill="#ffffff" fill-opacity="0.85" rx="3" stroke="#64748b"/>
    <!-- Millimeter tick marks -->
    <line x1="430" y1="235" x2="430" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="450" y1="235" x2="450" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="470" y1="235" x2="470" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="490" y1="235" x2="490" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="510" y1="235" x2="510" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="530" y1="235" x2="530" y2="245" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="300" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc" text-anchor="middle">Engineering Mini Drafter</text>
</svg>
