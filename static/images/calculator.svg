<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#calcGrad)"/>
  <circle cx="500" cy="80" r="140" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="100" cy="320" r="90" fill="#ffffff" fill-opacity="0.05"/>
  <!-- Calculator Body -->
  <g filter="url(#shadow)" transform="translate(190, 40)">
    <rect x="0" y="0" width="220" height="320" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <!-- Screen -->
    <rect x="25" y="25" width="170" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="180" y="65" font-family="Courier, monospace" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="end">sin(45°) = 0.707</text>
    <!-- Solar strip -->
    <rect x="30" y="95" width="60" height="12" rx="3" fill="#64748b"/>
    <!-- Brand -->
    <text x="185" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">TI-84 PLUS CE</text>
    <!-- Keys Grid -->
    <g fill="#334155" rx="6">
      <rect x="25" y="120" width="32" height="22" rx="4"/>
      <rect x="70" y="120" width="32" height="22" rx="4"/>
      <rect x="115" y="120" width="32" height="22" rx="4"/>
      <rect x="160" y="120" width="35" height="22" rx="4" fill="#0284c7"/>
      
      <rect x="25" y="152" width="32" height="22" rx="4"/>
      <rect x="70" y="152" width="32" height="22" rx="4"/>
      <rect x="115" y="152" width="32" height="22" rx="4"/>
      <rect x="160" y="152" width="35" height="22" rx="4" fill="#e11d48"/>

      <rect x="25" y="184" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="70" y="184" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="115" y="184" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="160" y="184" width="35" height="22" rx="4" fill="#f59e0b"/>

      <rect x="25" y="216" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="70" y="216" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="115" y="216" width="32" height="22" rx="4" fill="#475569"/>
      <rect x="160" y="216" width="35" height="22" rx="4" fill="#10b981"/>

      <rect x="25" y="248" width="77" height="24" rx="4" fill="#475569"/>
      <rect x="115" y="248" width="32" height="24" rx="4" fill="#475569"/>
      <rect x="160" y="248" width="35" height="52" rx="4" fill="#3b82f6"/>

      <rect x="25" y="278" width="32" height="22" rx="4" fill="#64748b"/>
      <rect x="70" y="278" width="77" height="22" rx="4" fill="#64748b"/>
    </g>
  </g>
  <text x="300" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">Scientific Graphing Calculator</text>
</svg>
