<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="bikeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bikeGrad)"/>
  <!-- Bicycle Illustration -->
  <g filter="url(#bikeShadow)" transform="translate(80, 50)">
    <!-- Wheels -->
    <circle cx="90" cy="210" r="70" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <circle cx="90" cy="210" r="14" fill="#334155"/>
    <circle cx="350" cy="210" r="70" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <circle cx="350" cy="210" r="14" fill="#334155"/>
    <!-- Spokes -->
    <line x1="90" y1="140" x2="90" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="210" x2="160" y2="210" stroke="#94a3b8" stroke-width="2"/>
    <line x1="350" y1="140" x2="350" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <line x1="280" y1="210" x2="420" y2="210" stroke="#94a3b8" stroke-width="2"/>
    <!-- Bike Frame -->
    <polygon points="90,210 200,210 270,110 160,110" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round"/>
    <line x1="200" y1="210" x2="270" y2="110" stroke="#38bdf8" stroke-width="10"/>
    <line x1="270" y1="110" x2="350" y2="210" stroke="#38bdf8" stroke-width="10"/>
    <!-- Fork & Handlebars -->
    <line x1="350" y1="210" x2="320" y2="75" stroke="#f1f5f9" stroke-width="9"/>
    <path d="M 300 70 L 335 70 L 350 90" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
    <!-- Seat Post & Saddle -->
    <line x1="200" y1="210" x2="185" y2="85" stroke="#f1f5f9" stroke-width="8"/>
    <path d="M 155 85 Q 185 80 215 85" stroke="#1e293b" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Pedals / Chainring -->
    <circle cx="200" cy="210" r="20" fill="#64748b"/>
  </g>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#d1fae5" text-anchor="middle">Campus Commuter Bicycle</text>
</svg>
