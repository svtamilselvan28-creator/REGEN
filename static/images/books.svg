<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bookGrad)"/>
  <!-- Stack of textbooks -->
  <g filter="url(#bookShadow)">
    <!-- Bottom Book -->
    <rect x="140" y="240" width="320" height="50" rx="8" fill="#1e3a8a"/>
    <rect x="170" y="248" width="280" height="34" rx="4" fill="#f8fafc"/>
    <rect x="140" y="240" width="30" height="50" rx="4" fill="#172554"/>
    <text x="310" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Calculus: Early Transcendentals</text>

    <!-- Middle Book -->
    <rect x="160" y="180" width="290" height="48" rx="8" fill="#047857"/>
    <rect x="185" y="188" width="255" height="32" rx="4" fill="#f8fafc"/>
    <rect x="160" y="180" width="25" height="48" rx="4" fill="#064e3b"/>
    <text x="310" y="209" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#047857">Data Structures &amp; Algorithms</text>

    <!-- Top Book -->
    <rect x="180" y="120" width="260" height="48" rx="8" fill="#be123c"/>
    <rect x="200" y="128" width="230" height="32" rx="4" fill="#f8fafc"/>
    <rect x="180" y="120" width="20" height="48" rx="4" fill="#881337"/>
    <text x="315" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#be123c">University Physics Vol. 1</text>
  </g>
  <text x="300" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#fef3c7" text-anchor="middle">College Textbooks &amp; Study Guides</text>
</svg>
