{% extends "base.html" %}

{% block title %}Page Not Found - ReCraft{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="py-5">
    <div class="avatar-circle mx-auto mb-3 bg-light text-primary" style="width: 80px; height: 80px; font-size: 2.2rem;">
      <i class="bi bi-question-circle"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404 - Page Not Found</h1>
    <p class="text-muted lead mb-4">
      The item or page you are looking for doesn't exist, was deleted, or the link is incorrect.
    </p>
    <div class="d-flex gap-2 justify-content-center">
      <a href="{{ url_for('browse') }}" class="btn btn-primary rounded-pill px-4 fw-semibold">
        Browse Available Items
      </a>
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-pill px-4">
        Go to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
